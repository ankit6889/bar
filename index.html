<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ankit's Bar</title>
<style>
:root{
  --bg:#12100e; --bg2:#1a1714; --card:#221e1a; --card2:#2a2520;
  --ink:#f0e9df; --ink2:#b8ad9e; --ink3:#7d7365;
  --amber:#e8a33d; --amber2:#c77f1f; --green:#7fb069; --red:#d9694f;
  --line:#352f28; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{padding:20px 16px 10px;text-align:center;background:linear-gradient(180deg,#1d1813,var(--bg))}
header h1{font-size:22px;letter-spacing:.5px;font-weight:700}
header h1 span{color:var(--amber)}
.stats{display:flex;justify-content:center;gap:18px;margin-top:8px;font-size:12px;color:var(--ink2)}
.stats b{color:var(--ink);font-size:15px;display:block;text-align:center}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(20,17,14,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--ink3);font-size:11px;padding:9px 0 7px;cursor:pointer;font-family:inherit}
nav button .ic{display:block;font-size:19px;margin-bottom:2px}
nav button.on{color:var(--amber)}
main{max-width:900px;margin:0 auto;padding:8px 12px}
.hide{display:none!important}
/* shelf */
.searchrow{display:flex;gap:8px;margin:6px 0 10px}
.searchrow input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:12px;font-size:15px;outline:none}
.searchrow input:focus{border-color:var(--amber2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--ink2);padding:6px 12px;border-radius:20px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--amber);color:#1c1508;border-color:var(--amber);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 10px 10px;cursor:pointer;position:relative;transition:transform .1s}
.card:active{transform:scale(.97)}
.card img{width:100%;height:120px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.card .nm{font-size:13px;font-weight:600;margin-top:8px;line-height:1.25}
.card .sub{font-size:11px;color:var(--ink3);margin-top:2px}
.badge{position:absolute;top:8px;right:8px;font-size:9.5px;padding:2px 7px;border-radius:9px;font-weight:700;letter-spacing:.3px}
.b-sealed{background:#2e3b28;color:var(--green)}
.b-low{background:#3d2620;color:var(--red)}
.b-attic{position:absolute;top:8px;left:8px;font-size:9.5px;padding:2px 7px;border-radius:9px;background:#33291c;color:#cfa35c}
.fillbar{height:3px;background:#39322a;border-radius:2px;margin-top:7px;overflow:hidden}
.fillbar i{display:block;height:100%;border-radius:2px;background:var(--amber)}
.fill-low i{background:var(--red)}
.count{color:var(--ink3);font-size:12px;margin:2px 2px 8px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:8px 18px calc(26px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet .grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 14px}
.sheet .top{display:flex;gap:16px;align-items:center}
.sheet .top img{width:96px;height:150px;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.sheet h2{font-size:19px;line-height:1.2}
.sheet .meta{color:var(--ink2);font-size:13px;margin-top:4px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{background:var(--card2);border:1px solid var(--line);color:var(--ink2);font-size:11px;padding:3px 9px;border-radius:12px}
.sec{margin-top:16px}
.sec h4{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--amber);margin-bottom:6px}
.sec p, .sec li{font-size:13.5px;color:var(--ink2)}
.sec ul{padding-left:18px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.kv div{background:var(--card);border-radius:10px;padding:8px 10px}
.kv .k{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px}
.kv .v{font-size:13.5px;margin-top:2px}
/* cocktails */
.pantrybar{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;cursor:pointer;font-size:13.5px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
.pantrylist{display:flex;flex-wrap:wrap;gap:6px;padding:10px 2px}
.rsec{margin:18px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink3)}
.rsec b{color:var(--amber)}
.recipe{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:9px;cursor:pointer}
.recipe .rt{display:flex;justify-content:space-between;align-items:baseline}
.recipe h3{font-size:15.5px}
.recipe .style{font-size:11px;color:var(--ink3)}
.recipe .ing{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.5}
.recipe .miss{color:var(--red);font-weight:600}
.recipe .use{color:var(--ink3)}
.recipe .steps{font-size:13px;color:var(--ink2);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:none}
.recipe.open .steps{display:block}
.lowwarn{color:#d9a34f}
/* shopping */
.shopcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:9px}
.shopcard h3{font-size:15px;display:flex;justify-content:space-between}
.shopcard h3 .n{color:var(--amber);font-size:13px}
.shopcard p{font-size:12.5px;color:var(--ink2);margin-top:4px}
.pillrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.pill{font-size:11px;background:var(--card2);border-radius:10px;padding:2px 8px;color:var(--ink2)}
.note{font-size:12px;color:var(--ink3);margin:14px 4px;text-align:center}
@media(min-width:700px){ .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))} }
</style>
</head>
<body>
<header>
  <h1>Ankit's <span>Bar</span></h1>
  <div class="stats" id="stats"></div>
</header>
<main>
  <!-- SHELF -->
  <section id="v-shelf">
    <div class="searchrow"><input id="q" type="search" placeholder="Search bottles, brands, flavours…" autocomplete="off"></div>
    <div class="chips" id="catchips"></div>
    <div class="chips" id="filtchips"></div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </section>
  <!-- COCKTAILS -->
  <section id="v-mix" class="hide">
    <div class="pantrybar" id="pantrybar"><span>🧺 Pantry — tap to adjust what's in the kitchen</span><span id="pantryn"></span></div>
    <div class="pantrylist hide" id="pantrylist"></div>
    <div id="recipes"></div>
  </section>
  <!-- SHOPPING -->
  <section id="v-shop" class="hide">
    <div class="rsec">Buy next — ranked by <b>drinks unlocked</b></div>
    <div id="shoplist"></div>
    <div class="rsec">Running low on the shelf</div>
    <div id="lowlist"></div>
  </section>
</main>
<nav>
  <button id="n-shelf" class="on" onclick="show('shelf')"><span class="ic">🥃</span>Shelf</button>
  <button id="n-mix" onclick="show('mix')"><span class="ic">🍸</span>Make a drink</button>
  <button id="n-shop" onclick="show('shop')"><span class="ic">🛒</span>Shopping</button>
</nav>
<div id="modal" class="modal hide"></div>

p","citrus","bittersweet tea"],"ck":["Last Word (the canonical use - equal parts gin, Green Chartreuse, maraschino, lime)","Chartreuse Swizzle","Bijou","Champs-Elysees","Tipperary","Green Chaud (hot chocolate)"],"serve":null,"subs":"Nothing is a true match. Genepy le Chamois, Dolin Genepy, Faccia Brutto Centerbe, L'Ermitage Green - all compromises.","notes":"THE MOST VALUABLE AND LEAST REPLACEABLE BOTTLE ON THE SHELF. In January 2023 the Carthusian order announced it would cap production permanently and 'not produce more than needed to sustain their order', citing environmental impact and their monastic life. Production sits at ~1.5-1.6 million bottles a year and the monks have refused to expand despite US sales roughly doubling since 2020. Result: strict allocation to d","tags":["green-chartreuse"]},{"id":"cointreau","name":"Cointreau L'Unique","brand":"Cointreau","cat":"Liqueur","sub":"Triple sec","abv":40,"vol":700,"fill":"3/4","opened":true,"loc":"main bar","origin":"Angers, France","price":3240,"drinks":"~13 drinks at 45ml","flav":["bitter orange peel","sweet orange","nutmeg","cinnamon","clean","dry finish"],"ck":["Margarita","Sidecar","Cosmopolitan","White Lady","Corpse Reviver No. 2","Between the Sheets"],"serve":null,"subs":"Combier, Pierre Ferrand Dry Curacao (drier, richer). Grand Marnier is NOT interchangeable in a true Margarita.","notes":"THE most load-bearing bottle in the collection - appears in more drinks than anything else owned. Founded 1849 by confectioner brothers in Angers; the extra-dry 'triple sec' style was developed in the 1920s after a British importer complained the original was too sweet.","tags":["orange-liqueur"]},{"id":"grand-marnier-cordon-rouge","name":"Grand Marnier Cordon Rouge","brand":"Grand Marnier","cat":"Liqueur","sub":"Orange cognac liqueur","abv":40,"vol":375,"fill":"full","opened":false,"loc":"main bar","origin":"France - cognac from the Cognac region","price":4900,"drinks":"~8 drinks at 45ml","flav":["candied orange zest" d’ claim on Indian aggregators is wrong. Label also prints www.butlersliqueurs.co.za and ‘for cocktails recipes’. Store between 5-25C per label.","tags":["orange-liqueur"]},{"id":"jeruk-peach-schnapps","name":"Jeruk Peach Schnapps (Original)","brand":"Jeruk","cat":"Liqueur","sub":"Peach liqueur","abv":17,"vol":700,"fill":"2/3","opened":true,"loc":"main bar","origin":"Germany - Bad Neuenahr-Ahrweiler, Rhinel","price":2000,"drinks":"~10 drinks at 45ml","flav":["ripe peach","sweet","juicy","floral"],"ck":["Sex on the Beach","Fuzzy Navel","Woo Woo","Bellini variations","Porn Star Martini style drinks","Peach Iced Tea highball"],"serve":null,"subs":"Archers, DeKuyper Peachtree, Giffard Creme de Peche de Vigne (substantially better)","notes":"'Jeruk' is Indonesian/Malay for citrus - an odd name for a German peach liqueur, which points to an export-only private-label brand created for Asian markets. At 17% this is a sweet liqueur, not schnapps in the German sense (a true Obstler would be unsweetened at 38-40%).","tags":["peach-liqueur"]},{"id":"scrappys-lavender","name":"Scrappy's Bitters Lavender","brand":"Scrappy's Bitters","cat":"Bitters","sub":"Floral bitters","abv":50.8,"vol":148,"fill":"full","opened":false,"loc":"main bar","origin":"Seattle, Washington, USA","price":2199,"drinks":"~250 dashes","flav":["lavender","bright","sweet","well rounded"],"ck":["G&T - the single highest-value use","Aviation family (does Creme de Violette's job without the sugar or colour)","French 75","Bee's Knees","White Lady","Champagne Cocktail"],"serve":null,"subs":"The Bitter Truth Violet; or lavender tincture plus a dash of orange bitters","notes":"Scrappy's flagship and widely credited as the first commercial lavender bitters. Part of a four-bottle gift/sample box.","tags":["floral-bitters"]},{"id":"scrappys-black-lemon","name":"Scrappy's Bitters Black Lemon","brand":"Scrappy's Bitters","cat":"Bitters","sub":"Citrus bitters","abv":49,"vol":148,"fill":"full","opened":false,"loc":"main bar","origin":"Seattle, Washington, USA","price":1847,"drinks":"~250 dashes","flav":["dried citrus","savoury lemon","dusty","slightly funky","floral"],"ck":["Manhattan - cuts the vermouth's sweetness where Angostura would double down on spice","Gin Old Fashioned","Margarita and mezcal drinks","Paloma","Vodka Martini / Gibson","Bloody Mary"],"serve":null,"subs":"Fee Brothers Lemon, Bitter Truth Lemon - neither has the dried/fermented depth","notes":"The most quietly useful of the four for a working bar - the one bitters here that improves a Manhattan, a Margarita and a Bloody Mary alike. Its trick is adding citrus aroma and bitterness without adding juice, so it lifts stirred drinks that can't take lemon.","tags":["citrus-bitters"]},{"id":"scrappys-orleans","name":"Scrappy's Bitters Orleans","brand":"Scrappy's Bitters","cat":"Bitters","sub":"Creole-style aromatic bitters","abv":47,"vol":148,"fill":"full","opened":false,"loc":"main bar","origin":"Seattle, Washington, USA","price":2199,"drinks":"~250 dashes","flav":["strong anise","citrus","cinnamon","floral finish","drier than Peychaud's"],"ck":["Sazerac - the primary reason to own this bottle","Vieux Carre","Cocktail a la Louisiane","Improved Whiskey Cocktail","Chrysanthemum","Brandy Crusta"],"serve":null,"subs":"Peychaud's Bitters is the direct equivalent and reference standard. Also Bitter Truth Creole.","notes":"A Peychaud's replacement made to Scrappy's all-natural standard. Drier and more citrus-and-cinnamon led, so a Sazerac made with it reads sharper and less candied - but it will not reproduce Peychaud's pink colour.","tags":["creole-bitters","peychauds"]},{"id":"scrappys-cardamom","name":"Scrappy's Bitters Cardamom","brand":"Scrappy's Bitters","cat":"Bitters","sub":"Spice bitters","abv":52,"vol":148,"fill":"full","opened":false,"loc":"main bar","origin":"Seattle, Washington, USA","price":1847,"drinks":"~250 dashes","flav":["green cardamom","aromatic","clean single-note"],"ck":["Moscow Mule - the single best use; cardamom and ginger are made for each other","Dark 'n' Stormy","G&T (cardamom is already in most gin botanical bills, so it amplifies)","Rum or bourbon Old Fashioned - a chai-ish variation","Espresso Martini","Painkiller and tiki drinks"],"serve":null,"subs":"Bob's Bitters Cardamom (arguably the reference), or a homemade green cardamom tincture","notes":"Of the four Scrappy's, the one that most reliably improves a drink you already make - one dash in a Moscow Mule or a G&T is an immediate upgrade. Particularly apt in an Indian context where cardamom is a familiar flavour. Bottled at 52%, the strongest of the four, because the spice infusion needs the proof to hold.","tags":["spice-bitters"]},{"id":"lillet-blanc","name":"Lillet Blanc","brand":"Lillet","cat":"Vermouth/Fortified","sub":"Quinquina aperitif wine","abv":17,"vol":750,"fill":"3/4","opened":true,"loc":"main bar","origin":"Podensac, Bordeaux (Graves), France","price":2250,"drinks":null,"flav":["orange blossom","candied orange","honey","fresh mint","vanilla","pine resin"],"ck":["Vesper Martini (the modern stand-in for Kina Lillet)","Corpse Reviver No. 2","White Negroni (with gin and Suze)","20th Century","French Blonde","Lillet Spritz (1 part Lillet, 2 parts tonic, orange slice)"],"serve":null,"subs":"Cocchi Americano is the closest and is actually more faithful to the old bitter Kina Lillet in a Vesper. Otherwise Dolin Blanc or Contratto Bianco.","notes":"First bottled 1887 by brothers Paul and Raymond Lillet. The recipe was substantially sweetened and de-bittered in 1986, which is why classic recipes calling for 'Kina Lillet' don't taste the same with modern Lillet Blanc.","tags":["lillet"]},{"id":"martini-fiero","name":"Martini & Rossi Fiero","brand":"Martini & Rossi","cat":"Vermouth/Fortified","sub":"Orange aromatised wine aperitivo","abv":15,"vol":750,"fill":"2/3","opened":true,"loc":"main bar","origin":"Turin, Piedmont, Italy","price":1600,"drinks":"~6 Fiero & Tonics at 75ml","flav":["bittersweet oran nd 'The Dusk' Gibson with pickled onion","subs":"Hapusa or Greater Than (same Indian craft wave); Four Pillars Rare Dry for spice-citrus character; Tanqueray for the role","notes":"The flagship Stranger & Sons - sister bottle to the Perry Road Peru. Dark glass; level unreadable. Indian MRP sticker on back. Launched 2018, a leader of India's craft gin renaissance; won IWSC Gold Outstanding in 2020 on its first entry - a first for an Indian gin, which sparked the Trading Tides collaboration with Australia's Four Pillars. The three-eyed, two-tailed label creature draws on Indian mythology.","tags":["gin"]},{"id":"monkey-47","name":"Monkey 47 Schwarzwald Dry Gin","brand":"Monkey 47","cat":"Gin","sub":"Complex dry gin - 47 botanicals","abv":47,"vol":500,"fill":"3/4","opened":true,"loc":"main bar","origin":"Black Forest, Germany","price":5000,"drinks":"~9 drinks at 45ml","flav":["intense juniper and pine/spruce","bright citrus","floral lavender","tart lingonberry fruit","herbal complexity","peppery spice"],"ck":["Gin & Tonic (dry tonic, 1:2)","Dry Martini","Gimlet","Negroni","French 75"],"serve":"G&T with a restrained measure of neutral dry tonic and minimal garnish so the 47 botanicals lead; also excellent neat at cellar temperature","subs":"No true equivalent; The Botanist or Hendrick's Orbium approximate the complexity; Gin Mare for herbal depth","notes":"Individually numbered hand-bottled edition. Cork intact. The recipe traces to RAF Wing Commander Montgomery 'Monty' Collins, who settled in the Black Forest after WWII, sponsored a monkey named Max at Berlin Zoo, and combined British gin tradition, Indian botanical memories and Black Forest ingredients. 47 botanicals, 47% ABV. The Traveller's Compendium is a duty-free collector's edition of the same Schwarzwald Dry G","tags":["gin"]},{"id":"tanqueray-no-ten","name":"Tanqueray No. TEN","brand":"Tanqueray","cat":"Gin","sub":"Premium citrus gin","abv":47.3,"vol":750,"fill":"half","opened":true,"loc":"main bar","origin":"Scotland","price":5460,"drinks":null,"flav":["fresh white grapefruit","zesty lime and orange","juniper core","soft floral chamomile","creamy rounded texture","clean citrus finish"],"ck":["Dry Martini (grapefruit twist)","Gin & Tonic","Gimlet","White Lady","Tom Collins","French 75"],"serve":"A crisp Martini garnished with a grapefruit twist - the serve it was created for in 2000","subs":"Tanqueray London Dry (drier, less citrus), Sipsmith V.J.O.P., Plymouth Gin","notes":"Fresh-citrus distilled gin - a proper Martini gin. Level ~50-60%. Launched in 2000, made with whole fresh citrus fruit rather than dried peel - unusual for gin. First white spirit inducted into the San Francisco World Spirits Competition Hall of Fame after winning Best White Spirit multiple years running. Named for the tiny 'Tiny Ten' pot still.","tags":["gin"]},{"id":"martini-rosso","name":"Martini & Rossi Rosso","brand":"Martini & Rossi","cat":"Vermouth/Fortified","sub":"Sweet red vermouth","abv":15,"vol":750,"fill":"full","opened":false,"loc":"main bar","origin":"Turin, Italy","price":1500,"drinks":null,"flav":["tobacco leaf","espresso/caramel","cinnamon and nutmeg spice","liquorice and anise","cola-like fruitiness","bittersweet herbaceous finish"],"ck":["Negroni","Americano","Manhattan","Rob Roy","Martinez","Vieux Carre"],"serve":"Americano: equal parts Rosso and Campari over ice, topped with soda, orange slice","subs":"Cinzano Rosso, Carpano Antica Formula (richer), Punt e Mes (more bitter)","notes":"SWEET VERMOUTH AT LAST - unlocks Negroni (with the new Campari), Manhattan, Rob Roy, Americano, Martinez. Appears sealed. Created in 1863 by Luigi Rossi, herbalist partner in the Turin firm that became Martini & Rossi, and marketed as 'the original Martini'. The recipe has passed down through the company's Master Herbalists for over 160 years. Difford's Guide lists it in 500+ cocktails.","tags":["sweet-vermouth"]},{"id":"martini-extra-dry","name":"Martini & Rossi Extra Dry","brand":"Martini & Rossi","cat":"Vermouth/Fortified","sub":"Dry vermouth","abv":15,"vol":750,"fill":"full","opened":false,"loc":"main bar","origin":"Turin, Italy","price":1500,"drinks":null,"flav":["crisp citrus/lemon zest","raspberry hint","orris root florality","subtle dry wood","clean bright finish"],"ck":["Dry Martini","Fifty-Fifty","Gibson","Tuxedo","Bronx","Perfect Manhattan"],"serve":"Classic Gin Martini: 75ml gin to 25ml Extra Dry, stirred, lemon twist or olive","subs":"Cinzano Extra Dry, Noilly Prat Original Dry (heavier, more oxidative), Dolin Dry (lighter)","notes":"DRY VERMOUTH AT LAST - the Martini family opens for the Botanist, Tanqueray No. TEN and Monkey 47. Launched on 1 January 1900, created to complement the emerging fashion for drier cocktails - it became the house pour for the 20th-century Dry Martini. Its acidity also pairs well with oily fish and marinated seafood at aperitivo hour.","tags":["dry-vermouth"]},{"id":"campari","name":"Campari Bitter","brand":"Campari","cat":"Amaro/Bitter","sub":"Red bitter aperitivo","abv":25,"vol":750,"fill":"full","opened":false,"loc":"main bar","origin":"Milan, Italy","price":2660,"drinks":null,"flav":["intense bitter orange","herbal-gentian bitterness","caramelised sweetness underneath","rhubarb and berry hints","warm spice","long cleansing bitter finish"],"ck":["Negroni","Americano","Campari Spritz","Boulevardier","Garibaldi","Jungle Bird"],"serve":"Campari & Soda, or the classic equal-parts Negroni; Garibaldi with 'fluffy' fresh orange juice","subs":"Aperol (lighter, sweeter), Luxardo Bitter, Contratto Bitter - none replicate Campari's exact bitterness in a Negroni","notes":"SEALED CAMPARI - with the Martini Rosso, the Negroni is fully unlocked. Also Americano, Boulevardier (Jim Beam/Wild Turkey), Jungle Bird (Old Monk!). Created in 1860 by Gaspare Campari; the Camparino bar in Milan's Galleria Vittorio Emanuele II became the heart of Italian aperitivo culture. The recipe remains secret; the famous red hue came from cochineal carmine until 2006. The irreplaceable bitter half of the Negro","tags":["campari","amaro"]},{"id":"aperol","name":"Aperol Aperitivo","brand":"Aperol","cat":"Amaro/Bitter","sub":"Orange aperitivo","abv":15,"vol":700,"fill":"full","opened":true,"loc":"main bar","origin":"Padua, Italy","price":3180,"drinks":"~10 spritzes at 60ml","flav":["zesty bitter orange","rhubarb","gentian-cinchona bitterness","touch of vanilla","herbal complexity","velvety bittersweet finish"],"ck":["Aperol Spritz","Paper Plane","Naked and Famous","Aperol Negroni (Contessa)","Aperol Sour"],"serve":"Aperol Spritz (3-2-1): 3 parts prosecco, 2 parts Aperol, 1 part soda over ice, orange slice","subs":"Campari (more bitter, higher proof), Select Aperitivo, Luxardo Aperitivo, Cappelletti","notes":"Aperol Spritz season is open (needs prosecco - you have two). Created in 1919 by brothers Luigi and Silvio Barbieri in Padua after seven years of experimentation; named from the French slang 'apero'. It boomed after WWII with the invention of the Spritz serve and became the engine of the global spritz craze after Campari Group acquired it in 2003.","tags":["aperol"]},{"id":"peychauds-bitters","name":"Peychaud's Aromatic Cocktail Bitters","brand":"Peychaud's","cat":"Bitters","sub":"Creole aromatic bitters","abv":35,"vol":296,"fill":"full","opened":true,"loc":"main bar","origin":"New Orleans, USA","price":1055,"drinks":null,"flav":["anise/licorice","bitter gentian root","candied cherry","floral notes","light clove spice","sweeter and lighter than Angostura"],"ck":["Sazerac","Vieux Carre","Seelbach","Cocktail a la Louisiane","Queen's Park Swizzle (float)"],"serve":"Sazerac: rye or cognac stirred with sugar and 3-4 dashes Peychaud's, absinthe-rinsed chilled glass, lemon peel","subs":"No true substitute; Bitter Truth Creole Bitters is the closest match; Angostura Aromatic is heavier and spicier","notes":"The real Peychaud's, 10oz bartender size - your Scrappy's Orleans was bought as its substitute and now has the original alongside. Sazerac properly equipped (with Absente 49 rinse). Created around 1830 by Antoine Amedee Peychaud, a Creole apothecary who fled Saint-Domingue and ran a pharmacy in the New Orleans French Quarter, dosing brandy toddies with his medicinal bitters. The recipe, essentially unchanged for near","tags":["peychauds"]},{"id":"angostura-orange","name":"Angostura Orange Bitters","brand":"Angostura","cat":"Bitters","sub":"Orange bitters","abv":28,"vol":100,"fill":"full","opened":true,"loc":"main bar","origin":"Trinidad","price":1600,"drinks":"~160 dashes","flav":["intense orange zest","dry (not sweet) citrus","floral orange blossom","warm spice undertone","clean bitter finish"],"ck":["Gin Martini (classic 1930s spec)","Old Fashioned","Casino","Pegu Club","Martinez","Perfect Manhattan"],"serve":"A dash or two in a Gin Martini, or alongside aromatic bitters in an Old Fashioned to lift citrus aromatics","subs":"Regans' Orange Bitters No. 6 (spicier, cardamom-led), Fee Brothers West Indian Orange (sweeter); bartenders often blend the two to approximate","notes":"Orange variant - key for orange-bitters Old Fashioned and a proper dry Martini. One of three Angosturas (with the open + sealed Aromatics). Launched by the House of Angostura in 2007 to answer the craft-cocktail revival's demand for orange bitters. Notably drier and more zest-forward than competing orange bitters, built purely on Trinidadian orange peel and local botanicals.","tags":["orange-bitters"]},{"id":"old-monk-7yo","name":"Old Monk 7 Years Old Very Old Vatted XXX","brand":"Old Monk","cat":"Rum","sub":"Indian dark vatted rum","abv":42.8,"vol":1000,"fill":"1/3","opened":true,"loc":"main bar","origin":"Ghaziabad, India","price":580,"drinks":null,"flav":["vanilla","caramel","chocolate","coffee","burnt sugar","warm baking spice"],"ck":["Old Monk & Cola","Rum Old Fashioned","Hot Toddy","Dark 'n' Stormy","Jungle Bird","Rum Punch"],"serve":"With chilled Coca-Cola and a squeeze of lime ('Monk & Cola'); neat or with warm water in winter","subs":"Goslings Black Seal, Myers's Original Dark, or any rich molasses-forward dark rum","notes":"The Indian icon in the cracked-glass flagon. Dark rum slot filled: Jungle Bird, Dark n Stormy, rum Old Fashioned. Launched 19 December 1954 by Mohan Meakin (successor to Dyer Breweries, est. 1855, Asia's first brewery). For decades the largest-selling dark rum in the world, famously without any advertising - cult status among Indian armed forces and students alike.","tags":["dark-rum"]},{"id":"jameson-triple-triple","name":"Jameson Triple Triple (sherry/bourbon/Malaga casks) 1L","brand":"Jameson","cat":"Whisky","sub":"Irish whiskey - travel exclusive","abv":40,"vol":1000,"fill":"full","opened":false,"loc":"main bar","origin":"Ireland","price":4790,"drinks":null,"flav":["ripe pear","citrus peel","raisin and dark fruit","clove","black pepper","dark chocolate"],"ck":["Triple Triple with Tonic & Grapefruit","Whiskey Highball","Whiskey Sour","Old Fashioned","Irish Coffee"],"serve":"Jameson's own serve: Triple Triple, tonic water and a wedge of grapefruit over ice","subs":"Jameson Black Barrel (closest domestic analogue), Jameson Original, Bushmills Black Bush","notes":"First Irish whiskey in the collection. Travel exclusive. Whiskey Sour, Irish Coffee, highball. A travel-retail exclusive extending Jameson's 'triple distilled' story to 'triple cask': bourbon and sherry maturation plus a Malaga fortified-wine cask that adds raisiny sweetness and spice.","tags":["irish"]},{"id":"wild-turkey-bourbon","name":"Wild Turkey Kentucky Straight Bourbon (81 proof export)","brand":"Wild Turkey","cat":"Whisky","sub":"Kentucky straight bourbon","abv":40.5,"vol":750,"fill":"2/3","opened":true,"loc":"main bar","origin":"Kentucky, USA","price":2623,"drinks":null,"flav":["honey","caramel","vanilla","maple","pear","toasted oak"],"ck":["Old Fashioned","Whiskey Sour","Manhattan","Mint Julep","Boulevardier","Gold Rush"],"serve":"On the rocks, or in an Old Fashioned - // ---------- helpers ----------
const FILLPCT={"full":100,"3/4":75,"2/3":66,"half":50,"1/3":33,"1/4":25,"low":10,"unknown":50};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ownedTags(){const t={};for(const b of BOTTLES){for(const tag of (b.tags||[])){(t[tag]=t[tag]||[]).push(b)}}return t}
const TAGMAP=ownedTags();

// ---------- nav ----------
function show(v){for(const x of ['shelf','mix','shop']){$('v-'+x).classList.toggle('hide',x!==v);$('n-'+x).classList.toggle('on',x===v)}window.scrollTo(0,0)}

// ---------- stats ----------

})();

// ---------- shelf ----------
let CAT='All', FILT=null, Q='';
const CATS=['All',...[...new Set(BOTTLES.map(b=>b.cat))].sort()];
$('catchips').innerHTML=CATS.map(c=>`<div class="chip${c==='All'?' on':''}" data-c="${esc(c)}">${esc(c)}</div>`).join('');
$('filtchips').innerHTML=['Sealed','Opened','Running low','Main bar','Attic'].map(f=>`<div class="chip" data-f="${f}">${f}</div>`).join('');
$('catchips').onclick=e=>{const c=e.target.dataset.c;if(!c)return;CAT=c;[...$('catchips').children].forEach(x=>x.classList.toggle('on',x.dataset.c===c));renderShelf()};
$('filtchips').onclick=e=>{const f=e.target.dataset.f;if(!f)return;FILT=(FILT===f?null:f);[...$('filtchips').children].forEach(x=>x.classList.toggle('on',x.dataset.f===FILT));renderShelf()};
$('q').oninput=e=>{Q=e.target.value.toLowerCase();renderShelf()};
function match(b){
  if(CAT!=='All'&&b.cat!==CAT)return false;
  if(FILT==='Sealed'&&b.opened)return false;
  if(FILT==='Opened'&&!b.opened)return false;
  if(FILT==='Running low'&&!['low','1/4'].includes(b.fill))return false;
  if(FILT==='Main bar'&&b.loc!=='main bar')return false;
  if(FILT==='Attic'&&b.loc!=='attic shelf')return false;
  if(Q){const hay=(b.name+' '+b.brand+' '+(b.sub||'')+' '+(b.flav||[]).join(' ')+' '+(b.tags||[]).join(' ')).toLowerCase();if(!Q.split(/\s+/).every(w=>hay.includes(w)))return false}
  return true;
}
function renderShelf(){
  const list=BOTTLES.filter(match);
  $('count').textContent=list.length+' bottle'+(list.length===1?'':'s');
  $('grid').innerHTML=list.map(b=>{
    const pct=FILLPCT[b.fill]??50, low=['low','1/4'].includes(b.fill);
    return `<div class="card" data-id="${b.id}">
      ${b.loc==='attic shelf'?'<span class="b-attic">ATTIC</span>':''}
      ${!b.opened?'<span class="badge b-sealed">SEALED</span>':(low?'<span class="badge b-low">LOW</span>':'')}
      <img loading="lazy" src="${IMGS[b.id]||''}" alt="">
      <div class="nm">${esc(b.name)}</div>
      <div class="sub">${esc(b.sub||b.cat)}</div>
      <div class="fillbar${low?' fill-low':''}"><i style="width:${pct}%"></i></div>
    </div>`}).join('');
}
$('grid').onclick=e=>{const c=e.target.closest('.card');if(c)openModal(c.dataset.id)};
function openModal(id){
  const b=BOTTLES.find(x=>x.id===id);if(!b)return;
  const kv=[];
  if(b.abv)kv.push(['ABV',b.abv+'%']);
  if(b.vol)kv.push(['Size',b.vol+' ml']);
  kv.push(['Level',b.fill+(b.opened?'':' (sealed)')]);
  kv.push(['Location',b.loc]);
  if(b.price)kv.push(['Price (₹)','₹'+b.price.toLocaleString('en-IN')]);
  if(b.drinks)kv.push(['Roughly left',b.drinks]);
  $('modal').innerHTML=`<div class="sheet" onclick="event.stopPropagation()">
    <div class="grab"></div>
    <div class="top"><img src="${IMGS[b.id]||''}" alt="">
      <div><h2>${esc(b.name)}</h2><div class="meta">${esc(b.sub||'')} · ${esc(b.origin||'')}</div>
      <div class="tagrow">${(b.flav||[]).slice(0,5).map(f=>`<span class="tag">${esc(f)}</span>`).join('')}</div></div></div>
    <div class="kv">${kv.map(([k,v])=>`<div><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>
    ${b.serve?`<div class="sec"><h4>Signature serve</h4><p>${esc(b.serve)}</p></div>`:''}
    ${b.ck&&b.ck.length?`<div class="sec"><h4>Best in</h4><p>${b.ck.map(esc).join(' · ')}</p></div>`:''}
    ${b.notes?`<div class="sec"><h4>Story</h4><p>${esc(b.notes)}</p></div>`:''}
    ${b.subs?`<div class="sec"><h4>Substitutes</h4><p>${esc(b.subs)}</p></div>`:''}
  </div>`;
  $('modal').classList.remove('hide');
  $('modal').onclick=()=>$('modal').classList.add('hide');
}

const pantryState={};PANTRY.forEach(p=>pantryState[p.id]=p.def);
$('pantrybar').onclick=()=>{$('pantrylist').classList.toggle('hide')};
function renderPantry(){
  $('pantrylist').innerHTML=PANTRY.map(p=>`<div class="chip${pantryState[p.id]?' on':''}" data-p="${p.id}">${esc(p.name)}</div>`).join('');
  $('pantryn').textContent=PANTRY.filter(p=>pantryState[p.id]).length+'/'+PANTRY.length;
}

// ---------- recipe engine ----------
function ingStatus(ing){
  if(ing.p){return pantryState[ing.p]?{ok:true,use:PANTRY.find(x=>x.id===ing.p).name}:{ok:false,need:PANTRY.find(x=>x.id===ing.p).name}}
  for(const t of ing.t){const owned=TAGMAP[t];if(owned&&owned.length){
    const best=owned.slice().sort((a,b)=>(FILLPCT[b.fill]??0)-(FILLPCT[a.fill]??0))[0];
    return {ok:true,use:best.name,low:['low','1/4'].includes(best.fill)&&owned.every(o=>['low','1/4'].includes(o.fill))}
  }}
  return {ok:false,need:ing.n};
}
function evalRecipe(r){
  const missing=[],uses=[];let anyLow=false;
  for(const ing of r.i){const s=ingStatus(ing);
    if(s.ok){uses.push({n:ing.n,use:s.use,low:s.low});if(s.low)anyLow=true}
    else missing.push({n:ing.n,need:s.need,tags:ing.t||null,p:ing.p||null});
  }
  return {missing,uses,anyLow};
}
function renderRecipes(){
  const ready=[],almost=[];
  for(const r of RECIPES){const ev=evalRecipe(r);
    if(ev.missing.length===0)ready.push({r,ev});
    else if(ev.missing.length===1)almost.push({r,ev});
  }
  $('makeable-n').textContent=ready.length;
  const rc=({r,ev},miss)=>`<div class="recipe" data-r="${esc(r.n)}">
    <div class="rt"><h3>${esc(r.n)}</h3><span class="style">${esc(r.s||'')}</span></div>
    <div class="ing">${r.i.map(i=>{const st=ingStatus(i);
      if(st.ok)return `${esc(i.n)}${i.ml?' '+i.ml:''}<span class="use"> → ${esc(st.use)}</span>${st.low?' <span class="lowwarn">⚠︎ low</span>':''}`;
      return `<span class="miss">${esc(i.n)} — missing</span>`}).join('<br>')}</div>
    <div class="steps">${esc(r.m)}</div></div>`;
  $('recipes').innerHTML=
    `<div class="rsec"><b>${ready.length}</b> you can make right now</div>`+
    ready.map(x=>rc(x)).join('')+
    (almost.length?`<div class="rsec"><b>${almost.length}</b> just one ingredient away</div>`+almost.map(x=>rc(x,true)).join(''):'');
}
$('recipes').onclick=e=>{const r=e.target.closest('.recipe');if(r)r.classList.toggle('open')};

// ---------- shopping ----------
function renderShop(){
  // candidate purchases: pantry items off + spirit tags not owned, referenced by recipes
  const cand={}; // key -> {name, unlocks:[recipeNames], type}
  for(const r of RECIPES){
    const ev=evalRecipe(r);
    if(ev.missing.length!==1)continue;
    const m=ev.missing[0];
    const key=m.p?('p:'+m.p):('t:'+(m.tags?m.tags[0]:m.n));
    if(!cand[key])cand[key]={name:m.need||m.n,unlocks:[],p:!!m.p};
    cand[key].unlocks.push(r.n);
  }
  const ranked=Object.values(cand).sort((a,b)=>b.unlocks.length-a.unlocks.length);
  $('shoplist').innerHTML=ranked.length?ranked.map(c=>`<div class="shopcard">
    <h3>${esc(c.name)} <span class="n">+${c.unlocks.length} drink${c.unlocks.length>1?'s':''}</span></h3>
    <p>${c.p?'Kitchen staple':'Bottle to buy'} — unlocks:</p>
    <div class="pillrow">${c.unlocks.map(u=>`<span class="pill">${esc(u)}</span>`).join('')}</div>
  </div>`).join(''):'<div class="note">Nothing is one ingredient away — the bar is deep. 🎉</div>';
  const low=BOTTLES.filter(b=>['low','1/4'].includes(b.fill));
  $('lowlist').innerHTML=low.map(b=>`<div class="shopcard"><h3>${esc(b.name)}</h3>
    <p>${b.fill==='low'?'Nearly empty':'Quarter left'}${b.drinks?' — '+esc(b.drinks):''}${b.price?' · last MRP ₹'+b.price.toLocaleString('en-IN'):''}</p></div>`).join('')||'<div class="note">Nothing running low.</div>';
}

// ---------- boot ----------
renderShelf();renderPantry();renderRecipes();renderShop();
</script>
</body>
</html>
